# Renders the site from committed outputs and publishes it to GitHub Pages.
# Raw data never enters CI: run the pipeline locally and commit outputs/.
#
# PUBLICATION IS OFF (MODEL-LOG L029): this runs only when started by hand.
# To publish on every push, replace the `on:` block with:
#   on:
#     push:
#       branches: [main, master]
#       paths: ["outputs/public/**", "site/**", "*.md", "R/site.R", "data-raw/manual/**"]
#     workflow_dispatch:
name: site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-publish:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026, mid-campaign (L031)
    runs-on: ubuntu-24.04
    env:
      # Linux binaries from the SAME dated CRAN snapshot the project uses on
      # Windows (see .Rprofile), so versions match renv.lock exactly (L031-L032).
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/2026-09-24
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (run-time needs of the binary packages, per renv's report)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev cmake gdal-bin libabsl-dev libglpk-dev libx11-dev pandoc
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Prepare pages from committed outputs
        run: Rscript -e 'source("R/utils.R"); source("R/site.R"); sync_site("site")'
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
