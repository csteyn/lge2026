# Runs the test suite on every push. Needs renv.lock (created by renv::init()).
name: tests
on: [push, pull_request]
jobs:
  testthat:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026, mid-campaign (L031)
    runs-on: ubuntu-24.04
    env:
      # Linux binaries from the SAME dated CRAN snapshot the project uses on
      # Windows (see .Rprofile), so versions match renv.lock exactly (L031-L032).
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/2026-09-24
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (run-time needs of the binary packages, per renv's report)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libpoppler-cpp-dev cmake gdal-bin libabsl-dev libglpk-dev libx11-dev pandoc
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
